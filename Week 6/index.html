<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f5f5f5;
            padding:20px;
        }

        .container{
            max-width:400px;
            margin:auto;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
            margin-bottom:20px;
        }

        h2,h3{
            text-align:center;
            margin-bottom:15px;
        }

        input,
        textarea{
            width:100%;
            padding:12px;
            margin-bottom:12px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        textarea{
            resize:none;
            height:100px;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            background:#007bff;
            color:white;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#0056b3;
        }

        .message-card{
            border:1px solid #ddd;
            border-radius:8px;
            padding:10px;
            margin-bottom:10px;
            background:white;
        }

        .message-card h4{
            margin-bottom:5px;
        }

        .message-card p{
            margin-bottom:5px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Contact Form -->
    <div class="card">
        <h2>Contact Us</h2>

        <input
            type="text"
            id="name"
            placeholder="Enter Your Name"
        >

        <input
            type="email"
            id="email"
            placeholder="Enter Your Email"
        >

        <textarea
            id="message"
            placeholder="Enter Your Message"
        ></textarea>

        <button onclick="saveMessage()">
            Submit Message
        </button>
    </div>

    <!-- Messages Section -->
    <div class="card">
        <h3>Messages from Database</h3>

        <div id="messages">
            <!-- Firebase data will appear here -->
        </div>
    </div>

</div>

<!-- Link JavaScript File -->
<script type="module" src="app.js"></script>

</body>
</html>
